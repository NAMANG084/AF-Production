<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Soundboard</title>
  <style>
    :root {
      --bg: #111a24;
      --panel: #172230;
      --panel-2: #0f1722;
      --text: #f3f6fb;
      --muted: #9eb0c3;
      --accent: #4fd1ff;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(79, 209, 255, 0.14), transparent 28%),
        linear-gradient(180deg, #1a2430 0%, #101720 100%);
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .mode-switch {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .mode-switch input {
      display: none;
    }

    .mode-switch .track {
      position: relative;
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      transition: background 140ms ease;
    }

    .mode-switch .track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: transform 140ms ease;
    }

    .mode-switch input:checked + .track {
      background: rgba(79, 209, 255, 0.45);
    }

    .mode-switch input:checked + .track::after {
      transform: translateX(20px);
    }

    button,
    .file-label {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      cursor: pointer;
      color: var(--text);
      background: linear-gradient(180deg, #253447 0%, #162230 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 12px 22px -14px var(--shadow);
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
    }

    button:hover,
    .file-label:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    button:active,
    .file-label:active {
      transform: translateY(1px);
    }

    .file-input {
      display: none;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      min-height: 210px;
      padding: 16px 8px 18px;
      border-radius: 22px;
      background: transparent;
      box-shadow: none;
    }

    .sound-btn {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.92);
      padding: 0;
      background: rgba(255, 255, 255, 0.08);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.18),
        0 10px 20px -16px rgba(0, 0, 0, 0.8);
    }

    .sound-btn::before,
    .sound-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .sound-btn::before {
      inset: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.16);
    }

    .sound-btn::after {
      display: none;
    }

    .sound-btn.playing {
      transform: translateY(3px) scale(0.98);
      filter: brightness(1.14);
    }

    .sound-btn span {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      font-size: 0.62rem;
      font-weight: 700;
      color: #101720;
      line-height: 1;
      pointer-events: none;
    }

    .label {
      min-height: 42px;
      font-size: 0.72rem;
      max-width: 92px;
      line-height: 1.2;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-transform: uppercase;
    }

    .hint {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .empty {
      margin-top: 18px;
      padding: 20px;
      text-align: center;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
    }

    @media (max-width: 1180px) {
      .board {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 14px;
      }

      .card {
        min-height: 220px;
        padding: 18px 10px 20px;
      }

      .sound-btn {
        width: 102px;
        height: 102px;
      }

      .sound-btn::after {
        display: none;
      }

      .label {
        max-width: 102px;
        font-size: 0.76rem;
      }
    }

    @media (max-width: 900px) {
      .board {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 20px, 1180px);
        padding-top: 20px;
      }

      .toolbar {
        justify-content: center;
      }

      .board {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .card {
        min-height: 210px;
        padding: 16px 8px 18px;
      }

      .sound-btn {
        width: 92px;
        height: 92px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="toolbar">
      <label class="mode-switch">
        <span id="mode-label">One</span>
        <input id="mode-toggle" type="checkbox" aria-label="Toggle multiple playback">
        <span class="track" aria-hidden="true"></span>
        <span>Multi</span>
      </label>
      <label class="mode-switch">
        <span id="stop-label">Stop</span>
        <input id="stop-toggle" type="checkbox" aria-label="Toggle tap again to stop" checked>
        <span class="track" aria-hidden="true"></span>
        <span>Lock</span>
      </label>
    </div>
    <section class="board" id="board"></section>
  </main>

  <script>
    const audioFiles = [
      "AUD-20260428-WA0015.mp3.mpeg",
      "AUD-20260428-WA0019.mp3.mpeg",
      "Aaye.mp3.mpeg",
      "Chalo.mp3.mpeg",
      "Coffee_beabadoobee.m4a.mp4",
      "Crowd-cheering-and-clapping.mp3.mpeg",
      "Matlab Wo Alag Hi Level Ka Banda Tha Meme.mp3.mpeg",
      "Rubber-Duck-Sound.mp3.mpeg",
      "Ruko-Jara.mp3.mpeg",
      "airhorn.mp3.mpeg",
      "audience-awwww.mp3.mpeg",
      "avengers.mp3.mpeg",
      "camaramen jaldi focas.mp3.mpeg",
      "cameraman-jaldi-focus-karo.mp3.mpeg",
      "cartoon-boing.mp3.mpeg",
      "cartoon-running.mp3.mpeg",
      "clock-ticking.mp3.mpeg",
      "crickets-chirping.mp3.mpeg",
      "crowd-laughing.mp3.mpeg",
      "disappointed-spongebob.mp3.mpeg",
      "doremon gedgit .mp3.mpeg",
      "dun-dun-duuuun.mp3.mpeg",
      "emotional-damage-meme.mp3.mpeg",
      "fahhh_KcgAXfs.mp3.mpeg",
      "ipl_latest_horn.mp3.mpeg",
      "le-beta.mp3.mpeg",
      "no_ball_siren.mp3.mpeg",
      "okay-meme.mp3.mpeg",
      "prop.mp3.mpeg",
      "rom-rom-bhaiyo.mp3.mpeg",
      "run-vine-sound-effect.mp3.mpeg",
      "sad bgm.mp3.mpeg",
      "shocked-sound-effect.mp3.mpeg",
      "spiderman-meme-song.mp3.mpeg",
      "spongebob-fail.mp3.mpeg",
      "super-mario-game-over.mp3.mpeg",
      "super-mario-jump.mp3.mpeg",
      "suspicious.mp3.mpeg",
      "tf_nemesis.mp3.mpeg",
      "tmpbxydyrz3.mp3.mpeg",
      "tum tum tenem.mp3.mpeg",
      "tum-dum-tedau.mp3.mpeg",
      "y2mate-mp3cut_sRzY6rh.mp3.mpeg"
    ];

    const formatLabel = (filename) =>
      filename
        .replace(/\.(mp3|mpeg|mp4|m4a)$/gi, "")
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();

    const presets = audioFiles.map((file) => ({
      name: formatLabel(file),
      file: `MEAM/${encodeURIComponent(file)}`,
    }));

    const audioPool = new Map(
      presets.map((sound) => {
        const audio = new Audio(sound.file);
        audio.preload = "auto";
        return [sound.file, audio];
      })
    );

    const board = document.getElementById("board");
    const modeToggle = document.getElementById("mode-toggle");
    const modeLabel = document.getElementById("mode-label");
    const stopToggle = document.getElementById("stop-toggle");
    const stopLabel = document.getElementById("stop-label");
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    let activeAudio = null;
    let activeButton = null;
    const activeAudios = new Map();

    const setButtonPlaying = (button, isPlaying) => {
      button.classList.toggle("playing", isPlaying);
      const icon = button.querySelector("span");
      if (icon) {
        icon.textContent = isPlaying ? "❚❚" : "▶";
      }
    };

    const cleanupAudio = (audio, button) => {
      if (activeAudio === audio) {
        activeAudio = null;
        activeButton = null;
      }
      if (activeAudios.get(button) === audio) {
        activeAudios.delete(button);
      }
      setButtonPlaying(button, false);
    };

    const stopAudio = (audio, button) => {
      audio.pause();
      audio.currentTime = 0;
      cleanupAudio(audio, button);
    };

    const stopAllAudios = () => {
      if (activeAudio && activeButton) {
        stopAudio(activeAudio, activeButton);
      }

      Array.from(activeAudios.entries()).forEach(([button, audio]) => {
        if (audio !== activeAudio) {
          stopAudio(audio, button);
        }
      });
    };

    const isMultiMode = () => modeToggle.checked;
    const canTapToStop = () => stopToggle.checked;

    modeToggle.addEventListener("change", () => {
      modeLabel.textContent = isMultiMode() ? "Multi" : "One";
      if (!isMultiMode()) {
        const latestEntry = Array.from(activeAudios.entries()).pop();
        if (latestEntry) {
          const [keepButton, keepAudio] = latestEntry;
          Array.from(activeAudios.entries()).forEach(([button, audio]) => {
            if (button !== keepButton) {
              stopAudio(audio, button);
            }
          });
          activeAudio = keepAudio;
          activeButton = keepButton;
        }
      }
    });

    stopToggle.addEventListener("change", () => {
      stopLabel.textContent = canTapToStop() ? "Stop" : "Lock";
    });

    const renderCard = (sound) => {
      const card = document.createElement("article");
      card.className = "card";

      const button = document.createElement("button");
      button.className = "sound-btn";
      button.type = "button";
      button.style.setProperty("--button-color", sound.color);
      button.innerHTML = "<span>▶</span>";

      const title = document.createElement("div");
      title.className = "label";
      title.textContent = sound.name;

      button.addEventListener("click", async () => {
        if (audioContext.state === "suspended") {
          await audioContext.resume();
        }

        const currentAudio = activeAudios.get(button);
        if (currentAudio) {
          if (canTapToStop()) {
            stopAudio(currentAudio, button);
          } else {
            currentAudio.currentTime = 0;
            currentAudio.play();
          }
          return;
        }

        if (!isMultiMode()) {
          stopAllAudios();
        }

        setButtonPlaying(button, true);

        if (sound.file) {
          const baseAudio = audioPool.get(sound.file);
          const audio = isMultiMode() ? baseAudio.cloneNode() : baseAudio;
          audio.preload = "auto";
          audio.currentTime = 0;
          activeAudios.set(button, audio);
          if (!isMultiMode()) {
            activeAudio = audio;
            activeButton = button;
          }
          audio.addEventListener("ended", () => {
            cleanupAudio(audio, button);
          });
          audio.addEventListener("pause", () => {
            if (audio.ended) {
              return;
            }
            cleanupAudio(audio, button);
          });
          audio.play();
          return;
        }

        setTimeout(() => setButtonPlaying(button, false), 180);
        playTone(sound.tone, sound.duration);
      });

      card.append(button, title);
      board.append(card);
    };

    const playTone = (frequency, duration) => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const now = audioContext.currentTime;

      oscillator.type = frequency < 140 ? "square" : frequency > 500 ? "triangle" : "sawtooth";
      oscillator.frequency.setValueAtTime(frequency, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + duration);
    };

    const loadPresetBoard = () => {
      board.innerHTML = "";
      presets.forEach(renderCard);
    };

    loadPresetBoard();
  </script>
</body>
</html>
